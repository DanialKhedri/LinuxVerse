<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LinuxVerse{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white">

    <header>
        <nav class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            
            <a href="/" class="text-2xl font-black">
                Linux<span class="text-cyan-400">Verse</span>
            </a>

            <a href="#course"
               class="px-5 py-2.5 rounded-xl bg-cyan-400 text-slate-950 font-bold hover:bg-cyan-300 transition">
                مشاهده دوره
            </a>

        </nav>
    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer class="border-t border-white/10 mt-24">
        <div class="max-w-7xl mx-auto px-6 py-8 text-center text-slate-500">
            © 2026 LinuxVerse
        </div>
    </footer>

</body>
</html>
